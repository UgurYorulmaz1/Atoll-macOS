<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Dynamic Island</title>
<style>
  :root { --bg: #0b0b0c; --card: #161618; --line: rgba(255,255,255,.08); --text: #f2f2f4; --dim: rgba(255,255,255,.55);
    --accent: #0a84ff; --green: #30d158; --red: #ff453a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  body { padding: 20px 22px 28px; user-select: none; background: radial-gradient(600px 260px at 50% -60px, rgba(10,132,255,.10), transparent 70%), var(--bg); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .head-l { display: flex; align-items: center; gap: 12px; }
  .logo { width: 46px; height: 22px; border-radius: 11px; background: #000; box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.18); position: relative; }
  .logo::after { content: ''; position: absolute; left: 8px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  h1 { font-size: 18px; font-weight: 650; letter-spacing: -.2px; }
  h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--dim); margin-top: 1px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 22px rgba(0,0,0,.22); }
  section h2 { font-size: 11.5px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; color: var(--dim); padding: 13px 16px 5px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 16px; border-top: 1px solid var(--line); transition: background .15s; }
  .row:hover { background: rgba(255,255,255,.018); }
  .scale-wrap { display: flex; align-items: center; gap: 10px; min-width: 170px; }
  .scale-wrap input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .scale-val { font-size: 12.5px; font-weight: 600; color: var(--text); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .swatches { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .sw-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
    transition: transform .18s, border-color .18s; position: relative; }
  .sw-dot:hover { transform: scale(1.12); }
  .sw-dot.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.22); }
  .sw-dot.auto { background: conic-gradient(#0a84ff, #30d158, #ff9f0a, #ff375f, #bf5af2, #0a84ff); }
  body.easy [data-adv="1"] { display: none !important; }
  section h2 + .row { border-top: 0; }
  .row .t { min-width: 0; }
  .row .t b { display: block; font-weight: 500; }
  .row .t span { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
  /* switch */
  .sw { position: relative; width: 42px; height: 24px; flex: none; }
  .sw input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw i { position: absolute; inset: 0; border-radius: 12px; background: #3a3a3c; transition: background .25s; }
  .sw i::after { content: ''; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .3s cubic-bezier(.3,1.3,.5,1); }
  .sw input:checked + i { background: var(--green); }
  .sw input:checked + i::after { transform: translateX(18px); }
  /* segmented control */
  .seg { display: flex; background: #2c2c2e; border-radius: 9px; padding: 2px; flex: none; }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 7px; cursor: pointer; transition: background .2s; }
  .seg button.on { background: #5a5a5e; }
  input[type=text] { width: 100%; background: #0e0e10; border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font: 13px "Cascadia Mono", Consolas, monospace; padding: 9px 11px; outline: none; user-select: text; transition: border-color .2s; }
  input[type=text]:focus { border-color: var(--accent); }
  .btn { border: 0; border-radius: 9px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; flex: none; transition: filter .2s, transform .15s; }
  .btn:hover { filter: brightness(1.15); } .btn:active { transform: scale(.97); }
  .btn.green { background: var(--green); color: #000; }
  .btn.gray { background: #3a3a3c; color: var(--text); }
  html:not(.mac) .mac-only { display: none !important; }
  html.mac .win-only { display: none !important; }
  .perm-ok { color: var(--green); font-weight: 600; font-size: 13px; flex: none; }
  .btn.red { background: rgba(255,69,58,.15); color: var(--red); }
  .col { display: block; }
  .col .line { display: flex; gap: 8px; margin-top: 8px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #636366; }
  .status.ok { color: var(--green); } .status.ok::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .hint { font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.5; }
  .hint code { font-family: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", Consolas, monospace; background: #2c2c2e; padding: 1px 5px; border-radius: 5px; color: var(--text); }
  .msg { font-size: 12px; margin-top: 6px; min-height: 16px; }
  .msg.err { color: var(--red); } .msg.ok { color: var(--green); }
  .soon { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .bar { height: 4px; margin: 0 16px 10px; border-radius: 2px; background: #2c2c2e; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 2px; transition: width .5s, background .3s; }
  .bar i.warn { background: #ff9f0a; }
  .row.off { opacity: .4; pointer-events: none; }
  .st-hero { font-size: 15px; line-height: 1.45; }
  .st-hero b { color: var(--green); }
  .st-bars { display: flex; align-items: flex-end; gap: 8px; height: 96px; margin: 14px 0 6px; }
  .st-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .st-bar i { display: block; width: 100%; max-width: 34px; border-radius: 6px 6px 3px 3px; background: linear-gradient(#30d158, #1f8f3e);
    min-height: 3px; transition: height .8s cubic-bezier(.22,.9,.24,1); }
  .st-bar.today i { background: linear-gradient(#64d2ff, #0a84ff); }
  .st-bar span { font-size: 10.5px; color: var(--dim); }
  .st-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .st-card { background: #0e0e10; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
  .st-card h4 { font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px; }
  .st-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 2px 0; }
  .st-row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-row em { font-style: normal; color: var(--dim); flex: none; }
  #statsSec.off .st-bars, #statsSec.off .st-grid, #statsSec.off .st-hero { display: none; }
  #statsSec:not(.off) #stOff { display: none; }
  footer { text-align: center; font-size: 11.5px; color: rgba(255,255,255,.3); margin-top: 6px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.28); }
  .toolbar { position: sticky; top: 0; z-index: 10; background: rgba(11,11,12,.92); backdrop-filter: blur(12px);
    padding: 8px 0 12px; margin: -6px 0 10px; display: flex; flex-direction: column; gap: 8px; }
  .searchbar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; transition: border-color .2s; }
  .searchbar:focus-within { border-color: var(--accent); }
  .searchbar svg { width: 15px; height: 15px; fill: var(--dim); flex: none; }
  .searchbar input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13px; user-select: text; }
  .searchbar input::placeholder { color: var(--dim); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { height: 0; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--dim); font: inherit; font-size: 12px; font-weight: 500;
    padding: 5px 11px; border-radius: 9px; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
  .tab:hover { color: var(--text); background: #202024; }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  select.langsel { background: #2c2c2e; color: var(--text); border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 12px; font: inherit; font-size: 13px; outline: none; cursor: pointer; }
  select.langsel:focus { border-color: var(--accent); }
  section.hidden, .row.hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="head-l">
    <div class="logo"></div>
    <h1>Atoll Island <small data-i="subtitle"></small></h1>
  </div>
  <div class="seg" id="easySeg" title="Basit / Gelişmiş Mod">
    <button data-v="1" data-i="modeEasy"></button>
    <button data-v="0" data-i="modeAdv"></button>
  </div>
</header>

<div class="toolbar">
  <label class="searchbar">
    <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
    <input id="searchSettings" type="text" data-i-ph="searchPh" spellcheck="false" autocomplete="off">
  </label>
  <div class="tabs" id="catTabs">
    <button class="tab on" data-cat="all" data-i="tabAll"></button>
    <button class="tab" data-cat="general" data-i="general"></button>
    <button class="tab" data-cat="custom" data-i="tabCustom"></button>
    <button class="tab" data-cat="extras" data-i="extras"></button>
    <button class="tab" data-cat="media" data-i="tabMedia"></button>
    <button class="tab" data-cat="shelf" data-i="shelf"></button>
    <button class="tab" data-cat="stats" data-i="statsTitle"></button>
  </div>
</div>

<section data-cat="general">
  <h2 data-i="general"></h2>
  <div class="row">
    <div class="t"><b data-i="autostart"></b><span data-i="autostartHint"></span></div>
    <label class="sw"><input type="checkbox" id="autostart"><i></i></label>
  </div>
  <div class="row mac-only">
    <div class="t"><b data-i="permAx"></b><span data-i="permAxHint"></span></div>
    <span class="perm-ok" id="axOk" hidden>✓</span><button class="btn gray" id="axBtn" data-i="permOpen"></button>
  </div>
  <div class="row mac-only">
    <div class="t"><b data-i="permFda"></b><span data-i="permFdaHint"></span></div>
    <span class="perm-ok" id="fdaOk" hidden>✓</span><button class="btn gray" id="fdaBtn" data-i="permOpen"></button>
  </div>
  <div class="row mac-only" data-adv="1">
    <div class="t"><b data-i="permAuto"></b><span data-i="permAutoHint"></span></div>
    <button class="btn gray" id="autoBtn" data-i="permOpen"></button>
  </div>
  <div class="row">
    <div class="t"><b data-i="language"></b></div>
    <select class="langsel" id="langSelect">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="ru">Русский</option>
      <option value="ar">العربية</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
    </select>
  </div>
  <div class="row" id="sizeRow">
    <div class="t"><b data-i="islandSize"></b><span data-i="islandSizeHint"></span></div>
    <div class="seg" id="islandSize"><button data-v="sm" data-i="sizeSm"></button><button data-v="md" data-i="sizeMd"></button><button data-v="lg" data-i="sizeLg"></button></div>
  </div>
  <div class="row">
    <div class="t"><b data-i="scaleMode"></b><span data-i="scaleModeHint"></span></div>
    <div class="seg" id="scaleMode"><button data-v="auto" data-i="scaleAuto"></button><button data-v="custom" data-i="scaleCustom"></button></div>
  </div>
  <div class="row" id="customScaleRow" style="display:none">
    <div class="t"><b data-i="customScale"></b><span data-i="customScaleHint"></span></div>
    <div class="scale-wrap"><input type="range" id="customScale" min="75" max="115" step="1"><span class="scale-val" id="customScaleVal">100%</span></div>
  </div>
  <div class="row" id="monRow">
    <div class="t"><b data-i="monitor"></b><span data-i="monitorHint"></span></div>
    <div class="seg" id="monitorSeg"></div>
  </div>
  <div class="row">
    <div class="t"><b data-i="autoDim"></b><span data-i="autoDimHint"></span></div>
    <label class="sw"><input type="checkbox" id="autoDim"><i></i></label>
  </div>
  <div class="row" data-adv="1">
    <div class="t"><b data-i="showSysMonitor"></b><span data-i="showSysMonitorHint"></span></div>
    <label class="sw"><input type="checkbox" id="showSysMonitor"><i></i></label>
  </div>
  <div class="row" data-adv="1">
    <div class="t"><b data-i="autoHideFullscreen"></b><span data-i="autoHideFullscreenHint"></span></div>
    <label class="sw"><input type="checkbox" id="autoHideFullscreen"><i></i></label>
  </div>
  <div class="row win-only" data-adv="1">
    <div class="t"><b data-i="gpuAccel"></b><span data-i="gpuAccelHint"></span></div>
    <label class="sw"><input type="checkbox" id="gpuAccel"><i></i></label>
  </div>
</section>

<section data-cat="custom">
  <h2 data-i="tabCustom"></h2>
  <div class="row">
    <div class="t"><b data-i="bgStyle"></b><span data-i="bgStyleHint"></span></div>
    <div class="seg" id="bgStyle"><button data-v="pure" data-i="bgPure"></button><button data-v="glass" data-i="bgGlass"></button><button data-v="tinted" data-i="bgTinted"></button></div>
  </div>
  <div class="row">
    <div class="t"><b data-i="accentColor"></b><span data-i="accentColorHint"></span></div>
    <div class="swatches" id="accentSwatches">
      <button class="sw-dot auto" data-v="auto" title="Auto"></button>
      <button class="sw-dot" data-v="#0a84ff" style="background:#0a84ff"></button>
      <button class="sw-dot" data-v="#30d158" style="background:#30d158"></button>
      <button class="sw-dot" data-v="#bf5af2" style="background:#bf5af2"></button>
      <button class="sw-dot" data-v="#ff9f0a" style="background:#ff9f0a"></button>
      <button class="sw-dot" data-v="#ff375f" style="background:#ff375f"></button>
      <button class="sw-dot" data-v="#64d2ff" style="background:#64d2ff"></button>
    </div>
  </div>
  <div class="row">
    <div class="t"><b data-i="topOffset"></b><span data-i="topOffsetHint"></span></div>
    <div class="scale-wrap"><input type="range" id="topOffset" min="0" max="48" step="1"><span class="scale-val" id="topOffsetVal">8 px</span></div>
  </div>
  <div class="row">
    <div class="t"><b data-i="idleOpacity"></b><span data-i="idleOpacityHint"></span></div>
    <div class="scale-wrap"><input type="range" id="idleOpacity" min="35" max="100" step="1"><span class="scale-val" id="idleOpacityVal">100%</span></div>
  </div>
  <div class="row">
    <div class="t"><b data-i="animSpeed"></b><span data-i="animSpeedHint"></span></div>
    <div class="seg" id="animSpeed"><button data-v="snappy" data-i="spdFast"></button><button data-v="normal" data-i="spdNorm"></button><button data-v="relaxed" data-i="spdSlow"></button></div>
  </div>
  <div class="row">
    <div class="t"><b data-i="clockFormat"></b><span data-i="clockFormatHint"></span></div>
    <div class="seg" id="clock24h"><button data-v="1">24h</button><button data-v="0">12h</button></div>
  </div>
  <div class="row">
    <div class="t"><b data-i="resetCustom"></b><span data-i="resetCustomHint"></span></div>
    <button class="btn gray" id="resetCustomBtn" data-i="reset"></button>
  </div>
</section>

<section data-cat="extras">
  <h2 data-i="extras"></h2>
  <div class="row" data-adv="1">
    <div class="t"><b data-i="singleSource"></b><span data-i="singleSourceHint"></span></div>
    <label class="sw"><input type="checkbox" id="singleSource"><i></i></label>
  </div>
  <div class="row">
    <div class="t"><b data-i="callAlerts"></b><span data-i="callAlertsHint"></span></div>
    <label class="sw"><input type="checkbox" id="callAlerts"><i></i></label>
  </div>
  <div class="row">
    <div class="t"><b data-i="weather"></b><span data-i="weatherHint"></span></div>
    <label class="sw"><input type="checkbox" id="weather"><i></i></label>
  </div>
  <div class="row">
    <div class="t"><b data-i="downloads"></b><span data-i="downloadsHint"></span></div>
    <label class="sw"><input type="checkbox" id="downloads"><i></i></label>
  </div>
  <div class="row">
    <div class="t"><b data-i="headsetAlerts"></b><span data-i="headsetAlertsHint"></span></div>
    <label class="sw"><input type="checkbox" id="headsetAlerts"><i></i></label>
  </div>
  <div class="row" data-adv="1">
    <div class="t"><b data-i="privacyDots"></b><span data-i="privacyDotsHint"></span></div>
    <label class="sw"><input type="checkbox" id="privacyDots"><i></i></label>
  </div>
  <div class="row" data-adv="1">
    <div class="t"><b data-i="recordingDot"></b><span data-i="recordingDotHint"></span></div>
    <label class="sw"><input type="checkbox" id="recordingDot"><i></i></label>
  </div>
  <div class="row" data-adv="1">
    <div class="t"><b data-i="listeningStats"></b><span data-i="listeningStatsHint"></span></div>
    <label class="sw"><input type="checkbox" id="listeningStats"><i></i></label>
  </div>
  <div class="row" data-adv="1">
    <div class="t"><b data-i="audioSwitch"></b><span data-i="audioSwitchHint"></span></div>
    <label class="sw"><input type="checkbox" id="audioSwitch"><i></i></label>
  </div>
  <div class="row" data-adv="1">
    <div class="t"><b data-i="globalShortcut"></b><span data-i="globalShortcutHint"></span></div>
    <label class="sw"><input type="checkbox" id="globalShortcut"><i></i></label>
  </div>
</section>

<section data-cat="media">
  <h2 lang="en">Spotify</h2>
  <div class="row col">
    <div class="t" style="display:flex;justify-content:space-between;align-items:center">
      <b>Client ID</b><span class="status" id="spStatus"></span>
    </div>
    <div class="line">
      <input type="text" id="clientId" maxlength="32" spellcheck="false" autocomplete="off" placeholder="Client ID">
      <button class="btn gray" id="saveId" data-i="save"></button>
    </div>
    <div class="msg" id="idMsg"></div>
    <div class="hint" data-i-html="clientHint"></div>
  </div>
  <div class="row">
    <div class="t"><b data-i="account"></b><span data-i="accountHint"></span></div>
    <button class="btn green" id="spBtn"></button>
  </div>
  <div class="row">
    <div class="t"><b data-i="spotifyAutoplay"></b><span data-i="spotifyAutoplayHint"></span></div>
    <label class="sw"><input type="checkbox" id="spotifyAutoplay"><i></i></label>
  </div>
</section>

<section data-cat="media">
  <h2 data-i="lyrics"></h2>
  <div class="row">
    <div class="t"><b data-i="browserLyrics"></b><span data-i="browserLyricsHint"></span></div>
    <label class="sw"><input type="checkbox" id="browserLyrics"><i></i></label>
  </div>
</section>

<section data-cat="shelf">
  <h2 data-i="shelf"></h2>
  <div class="row">
    <div class="t"><b data-i="storage"></b><span id="storageHint"></span></div>
    <div class="seg" id="storage"><button data-v="disk" data-i="disk"></button><button data-v="ram">RAM</button></div>
  </div>
  <div class="row col" id="dirRow">
    <div class="t"><b data-i="folder"></b></div>
    <div class="line">
      <input type="text" id="storageDir" readonly>
      <button class="btn gray" id="pickDir" data-i="change"></button>
      <button class="btn gray" id="resetDir" data-i="reset"></button>
    </div>
  </div>
  <div class="row" id="ramExitRow">
    <div class="t"><b data-i="saveRam"></b><span data-i="saveRamHint"></span></div>
    <label class="sw"><input type="checkbox" id="saveRamOnExit"><i></i></label>
  </div>
  <div class="row">
    <div class="t"><b data-i="limit"></b><span id="usage"></span></div>
    <div class="line" style="margin:0;align-items:center;gap:6px">
      <input type="text" id="limitGb" style="width:70px;text-align:right" inputmode="decimal"><span>GB</span>
    </div>
  </div>
  <div class="bar"><i id="usageBar"></i></div>
  <div class="row">
    <div class="t"><b data-i="clipboardHistory"></b><span data-i="clipboardHistoryHint"></span></div>
    <label class="sw"><input type="checkbox" id="clipboardHistory"><i></i></label>
  </div>
</section>

<section id="statsSec" data-cat="stats">

// other languages: reuse their strings with macOS terms
const macify = (v) => typeof v !== 'string' ? v : v.replace(/Ctrl\+Shift\+Space/g, '⌃⇧Space').replace(/Xbox Game Bar|Game Bar/g, 'QuickTime')

let st = {}, lang = 'tr', connecting = false, activeCat = 'all', filterQ = '';
const t = (k, ...a) => {
  let v = IS_MAC && MAC.en[k] !== undefined ? ((MAC[lang] && MAC[lang][k]) || (lang === 'tr' || lang === 'en' ? null : macify((T[lang] && T[lang][k]))) || MAC.en[k]) : undefined;
  if (v === undefined || v === null) v = (T[lang] && T[lang][k]) || T.en[k] || T.tr[k] || k;
  if (IS_MAC) v = macify(v);
  return typeof v === 'function' ? v(...a) : v;

function applyFilter() {
  const q = filterQ.trim().toLowerCase();
  document.querySelectorAll('section[data-cat]').forEach((sec) => {
    const catOk = activeCat === 'all' || sec.dataset.cat === activeCat;
    if (!catOk) { sec.classList.add('hidden'); return; }
    let anyRow = false;
    sec.querySelectorAll('.row').forEach((row) => {
      const match = !q || row.textContent.toLowerCase().includes(q);
      row.classList.toggle('hidden', !match);
      if (match) anyRow = true;
    });
    sec.classList.toggle('hidden', q ? !anyRow : false);
  });
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach((el) => el.textContent = t(el.dataset.i));
  document.querySelectorAll('[data-i-html]').forEach((el) => el.innerHTML = t(el.dataset.iHtml));
  document.querySelectorAll('[data-i-ph]').forEach((el) => el.placeholder = t(el.dataset.iPh));
  document.title = 'Dynamic Island · ' + t('subtitle');
}
function render() {
  lang = st.lang || 'tr';
  applyLang();
  $('autostart').checked = !!st.autostart;
  if (IS_MAC && st.mac) {
    $('axOk').hidden = !st.mac.accessibility; $('axBtn').hidden = !!st.mac.accessibility;

  }
  $('browserLyrics').checked = !!st.browserLyrics;
  for (const k of ['showSysMonitor', 'autoHideFullscreen', 'autoDim', 'gpuAccel', 'headsetAlerts', 'privacyDots', 'recordingDot', 'listeningStats', 'audioSwitch', 'globalShortcut', 'callAlerts', 'weather', 'downloads', 'spotifyAutoplay']) $(k).checked = k === 'gpuAccel' ? st[k] !== false : !!st[k];

  $('langSelect').value = lang;
  const easy = st.easyMode !== false;
  document.body.classList.toggle('easy', easy);

  $('sizeRow').style.display = sm === 'auto' ? '' : 'none';

  $('customScaleVal').textContent = cs + '%';
  document.querySelectorAll('#bgStyle button').forEach((b) => b.classList.toggle('on', b.dataset.v === (st.bgStyle || 'pure')));
  document.querySelectorAll('#accentSwatches button').forEach((b) => b.classList.toggle('on', b.dataset.v === (st.accentColor || 'auto')));
  const to = Math.max(0, Math.min(48, Number(st.topOffset ?? 8)));
  if (document.activeElement !== $('topOffset')) $('topOffset').value = String(to);
  $('topOffsetVal').textContent = to + ' px';
  const io = Math.max(35, Math.min(100, Number(st.idleOpacity ?? 100)));
  if (document.activeElement !== $('idleOpacity')) $('idleOpacity').value = String(io);
  $('idleOpacityVal').textContent = io + '%';
  document.querySelectorAll('#animSpeed button').forEach((b) => b.classList.toggle('on', b.dataset.v === (st.animSpeed || 'normal')));
  const c24 = st.clock24h !== false;
  document.querySelectorAll('#clock24h button').forEach((b) => b.classList.toggle('on', (b.dataset.v === '1') === c24));
  document.querySelectorAll('#islandSize button').forEach((b) => b.classList.toggle('on', b.dataset.v === (st.islandSize || 'md')));
  const mons = Array.isArray(st.monitors) ? st.monitors : [];
  const mseg = $('monitorSeg');
  if (mseg) {
    mseg.textContent = '';
    mons.forEach((m, i) => {
      const btn = document.createElement('button');
      btn.textContent = (lang !== 'tr' ? 'Screen ' : 'Ekran ') + (i + 1) + (m.primary ? ' ★' : '');
      btn.title = `${m.name} (${m.width}×${m.height})`;
      btn.classList.toggle('on', (st.monitorIndex || 0) === m.index);
      btn.addEventListener('click', () => set('monitorIndex', m.index));
      mseg.append(btn);
    });
    $('monRow').style.display = mons.length > 0 ? '' : 'none';
  }

  if (ok) connecting = false;
  $('spStatus').className = 'status' + (ok ? ' ok' : '');
  $('spStatus').textContent = ok ? t('connected') : (connecting ? t('connecting') : t('notConnected'));
  $('spBtn').textContent = ok ? t('disconnect') : t('connect');
  $('spBtn').className = 'btn ' + (ok ? 'red' : 'green');
  $('dataDir').textContent = st.dataDir ? t('dataDir') + st.dataDir : '';

  $('storageHint').textContent = ram ? t('storageRam', st.ramLimitGb) : t('storageDisk');

  $('usage').textContent = t('usage', usedGb < 10 ? usedGb.toFixed(2).replace('.', lang === 'tr' ? ',' : '.') : usedGb.toFixed(1), st.limitGb || 16);
  const pct = Math.min(100, usedGb / (st.limitGb || 16) * 100);
  $('usageBar').style.width = pct + '%'; $('usageBar').classList.toggle('warn', pct > 85);
}
async function set(key, value) {
  try { st = await invoke('set_setting', { key, value }); render(); return true; }
  catch (e) { return String(e); }
}

/* ---------- listening summary ---------- */
function dur(secs) {
  secs = Math.max(0, Math.round(secs || 0));
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
  if (lang !== 'tr') return h ? h + ' h ' + m + ' min' : m ? m + ' min' : secs + ' s';
  return h ? h + ' saat ' + m + ' dk' : m ? m + ' dk' : secs + ' sn';
}
function shortDur(secs) { const m = Math.round((secs || 0) / 60); return m >= 60 ? (m / 60).toFixed(1) + (lang !== 'tr' ? ' h' : ' sa') : m ? m + (lang !== 'tr' ? ' min' : ' dk') : (secs || 0) + (lang !== 'tr' ? ' s' : ' sn'); }
function rows(el, list) {
  el.textContent = '';
  (list || []).slice(0, 5).forEach((it) => {
    const r = document.createElement('div'); r.className = 'st-row';
    const a = document.createElement('span'); a.textContent = it.name; a.title = it.name;
    const b = document.createElement('em'); b.textContent = shortDur(it.secs);
    r.append(a, b); el.append(r);
  });
}
function renderStats(s) {
  const on = !!st.listeningStats;
  $('statsSec').classList.toggle('off', !on);
  if (!on || !s) return;
  if (!s.todaySecs && !s.weekSecs) { $('stHero').textContent = t('statsEmpty'); }
  else $('stHero').innerHTML = t('statsToday', dur(s.todaySecs), s.topArtistToday ? s.topArtistToday.replace(/[<>&]/g, '') : '') + ' ' + t('statsWeek', dur(s.weekSecs));
  const bars = s.dailyBars || [], max = Math.max(1, ...bars.map((b) => b.secs || 0));
  const box = $('stBars'); box.textContent = '';
  bars.forEach((b, i) => {
    const d = new Date(b.date + 'T12:00:00');
    const col = document.createElement('div'); col.className = 'st-bar' + (i === bars.length - 1 ? ' today' : '');
    col.title = dur(b.secs);
    const bar = document.createElement('i'); bar.style.height = '3px';
    const lbl = document.createElement('span'); lbl.textContent = t('days')[d.getDay()];
    col.append(bar, lbl); box.append(col);
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.height = Math.max(3, (b.secs || 0) / max * 72) + 'px'; }));
  });
  rows($('stArtists'), s.topArtistsWeek);
  rows($('stTracks'), s.topTracksWeek);
}
async function loadStats() { try { renderStats(await invoke('get_stats')); } catch {} }
