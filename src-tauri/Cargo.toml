[package]
name = "island"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "sync"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
png = "0.17"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ---------- macOS 13 Ventura ... latest ----------
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2"
plist = "1"
drag = "2.1"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSString", "NSArray", "NSDictionary", "NSData", "NSURL", "NSValue", "NSObject", "NSLocale",
  "NSFileManager", "NSGeometry", "NSProcessInfo", "NSEnumerator", "NSDate", "NSThread",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication", "NSResponder", "NSWindow", "NSPanel", "NSScreen", "NSEvent", "NSWorkspace",
  "NSRunningApplication", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSImageRep", "NSBitmapImageRep",
  "NSGraphicsContext", "NSGraphics", "NSSavePanel", "NSOpenPanel", "NSPanel", "NSView", "NSColor",
  "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboardItem", "objc2-core-foundation",
] }

# ---------- Windows 10 / 11 ----------
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-future = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation", "Foundation_Collections", "Media", "Media_Control", "Storage_Streams",
  "UI_Notifications", "UI_Notifications_Management", "ApplicationModel",
  "Devices_Enumeration",
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_LibraryLoader",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Ole", "Win32_System_DataExchange",
  "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_HiDpi",
  "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Security", "Win32_UI_Accessibility", "Win32_Globalization", "Devices_Bluetooth", "Devices_Bluetooth_Rfcomm", "Devices_Enumeration", "Networking", "Networking_Sockets",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties",
]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
